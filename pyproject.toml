[project]
name = "edge-surveillance"
version = "0.1.0"
description = "Motion detection + face recognition (MobileFaceNet) for PC and Termux/Android"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.5.4",
    "numpy",
    "pyyaml",
    "onnxruntime",
    "fastapi",
    "uvicorn",
    "requests",
]

[project.scripts]
edge-enroll = "edge_surveillance.cli.enroll:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_surveillance"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
