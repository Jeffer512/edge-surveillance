camera:
  # 0 = webcam, or http://127.0.0.1:8080/video (IP Webcam), rtsp://..., path/to/video.mp4
  source: "0"
  width: 640
  height: 480
  fps: 15

motion:
  min_change_percent: 1.5
  threshold: 25
  min_area_percent: 1.0
  probe_width: 320
  probe_height: 240
  cooldown_s: 0.5

detector:
  model: "models/face_detection_yunet.onnx"
  score_threshold: 0.8
  nms_threshold: 0.3
  input_size: [320, 320]
  # How long a face box stays on screen after the last motion frame that
  # produced it. 0 disables the hold and boxes vanish as soon as motion stops.
  report_ttl_s: 2.0

recognizer:
  model: "models/mobilefacenet.onnx"
  similarity_threshold: 0.5

events:
  dir: "data/events"
  known_cooldown_s: 30.0
  unknown_cooldown_s: 60.0

store:
  gallery: "data/embeddings.pkl"
  events_db: "data/events.db"

server:
  host: "127.0.0.1"
  port: 8000
